<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お絵描きツール</title>
    <style>
        :root {
            --bg-color: #f5f6fa;
            --panel-bg: #ffffff;
            --text-color: #2f3640;
            --accent-color: #4cd137;
            --border-color: #dcdde1;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            margin-bottom: 10px;
            font-size: 1.5rem;
        }
        .app-container {
            display: flex;
            gap: 20px;
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 1000px;
            width: 100%;
        }
        .toolbar {
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 150px;
        }
        .tool-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .tool-group label {
            font-size: 0.85rem;
            font-weight: bold;
            color: #718093;
        }
        button, label.btn-label {
            padding: 10px 14px;
            border: 2px solid var(--border-color);
            background: #ffffff;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            text-align: center;
        }
        button:hover, label.btn-label:hover {
            border-color: #718093;
        }
        button.active {
            background: var(--text-color);
            color: #ffffff;
            border-color: var(--text-color);
        }
        input[type="color"] {
            width: 100%;
            height: 40px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            background: none;
            padding: 0;
        }
        .canvas-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
        }
        canvas {
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background: #ffffff;
            cursor: crosshair;
            touch-action: none;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            width: 100%;
        }
        .action-buttons button {
            flex: 1;
        }
    </style>
</head>
<body>

    <h1>お絵描きアプリ</h1>
    <div class="app-container">
        <!-- ツールバー -->
        <div class="toolbar">
            <div class="tool-group">
                <label>モード</label>
                <button id="btn-pen" class="active" onclick="setMode('pen')">ペン</button>
                <button id="btn-eraser" onclick="setMode('eraser')">消しゴム</button>
            </div>

            <div class="tool-group">
                <label>線の太さ</label>
                <button id="size-1" class="active" onclick="setSize(1)">1px (いまのまま)</button>
                <button id="size-4" onclick="setSize(4)">4px</button>
                <button id="size-16" onclick="setSize(16)">16px</button>
            </div>

            <div class="tool-group">
                <label>ペンの色</label>
                <input type="color" id="color-picker" value="#000000" onchange="setColor(this.value)">
            </div>
        </div>

        <!-- キャンバスエリア -->
        <div class="canvas-container">
            <canvas id="drawingCanvas" width="600" height="400"></canvas>
            <div class="action-buttons">
                <button onclick="clearCanvas()" style="background-color: #ff7675; color: white; border: none;">全消去</button>
                <button onclick="saveImage()" style="background-color: #55efc4; border: none;">保存</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');

        let isDrawing = false;
        let currentMode = 'pen'; // 'pen' or 'eraser'
        let currentSize = 1;
        let currentColor = '#000000';
        let lastX = 0;
        let lastY = 0;

        // 初期設定
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineWidth = currentSize;
        ctx.strokeStyle = currentColor;

        // モード変更
        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btn-pen').classList.toggle('active', mode === 'pen');
            document.getElementById('btn-eraser').classList.toggle('active', mode === 'eraser');
        }

        // サイズ変更
        function setSize(size) {
            currentSize = size;
            document.getElementById('size-1').classList.toggle('active', size === 1);
            document.getElementById('size-4').classList.toggle('active', size === 4);
            document.getElementById('size-16').classList.toggle('active', size === 16);
        }

        // 色変更
        function setColor(color) {
            currentColor = color;
        }

        // 描画イベント
        function startDrawing(e) {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            lastX = (e.clientX || e.touches[0].clientX) - rect.left;
            lastY = (e.clientY || e.touches[0].clientY) - rect.top;
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();

            const rect = canvas.getBoundingClientRect();
            const currentX = (e.clientX || e.touches[0].clientX) - rect.left;
            const currentY = (e.clientY || e.touches[0].clientY) - rect.top;

            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(currentX, currentY);

            if (currentMode === 'eraser') {
                ctx.strokeStyle = '#ffffff'; // 消しゴムは白で塗りつぶす
            } else {
                ctx.strokeStyle = currentColor;
            }

            ctx.lineWidth = currentSize;
            ctx.stroke();

            lastX = currentX;
            lastY = currentY;
        }

        function stopDrawing() {
            isDrawing = false;
        }

        // マウスイベント
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        // タッチイベント（スマホ・タブレット対応）
        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', stopDrawing);

        // 全消去
        function clearCanvas() {
            if (confirm('キャンバスをクリアしますか？')) {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }

        // 保存
        function saveImage() {
            const link = document.createElement('a');
            link.download = 'my-drawing.png';
            link.href = canvas.toDataURL();
            link.click();
        }

        // 初期背景を白に
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    </script>
</body>
</html>
